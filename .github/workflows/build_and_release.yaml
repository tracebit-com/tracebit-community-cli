name: Build and Release

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'package/**'
      - 'installers/**'
      - 'global.json'
      - 'qodana.yaml'
      - 'qodana.sarif.json'
      - 'Tracebit.Cli/**'
      - 'installers/**'
      - 'trigger.md'

permissions: {}

jobs:

  #####################
  # Format and Qodana #
  #####################

  format_and_qodana:
    name: Format and Qodana
    permissions:
      contents: write
      pull-requests: write
      checks: write
    uses: $/.github/workflows/_format_and_qodana.yaml
    secrets:
      qodana-token: ${{ secrets.QODANA_TOKEN }}
      security-api-token: ${{ secrets.SECURITY_API_TOKEN }}

  #########
  # Build #
  #########

  build_cli:
    name: Build CLI
    permissions:
      id-token: write
      contents: read
    uses: $/.github/workflows/_build_cli.yaml
    with:
      sign: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
    secrets: # only available when sign is true
      MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
      MACOS_APPLICATION_KEY_CERTIFICATE_BASE64: ${{ secrets.MACOS_APPLICATION_KEY_CERTIFICATE_BASE64 }}
      MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
      MACOS_INSTALLER_KEY_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_KEY_CERTIFICATE_BASE64 }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_NOTARIZATION_APPLEID: ${{ secrets.MACOS_NOTARIZATION_APPLEID }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build_cli
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1@v8
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          customer-id: tracebit
          profile: administrator
          profile-region: us-east-1
          async: true
      - run: |
          mkdir ${{ runner.temp }}/release-artifacts
          cp -n ${{ runner.temp }}/artifacts/install-tracebit-*/* ${{ runner.temp }}/release-artifacts/
          cp -n ${{ runner.temp }}/artifacts/tracebit-*/* ${{ runner.temp }}/release-artifacts/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "${prerelease_flag[@]}" \
            "$RUNNER_TEMP"/release-artifacts/*

