name: Format and Qodana

on:
  workflow_call:
    secrets:
      qodana-token:
        description: 'Qodana token'
        required: true
      security-api-token:
        description: 'Tracebit API token'
        required: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  validate-format:
    name: "Format"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          api-token: ${{ secrets.security-api-token }}
          customer-id: tracebit
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json
      - name: Install tools
        run: dotnet tool restore
      - name: Inspect code
        run: 'dotnet format'
      - name: Check for changes
        run: |
          git diff --exit-code --stat || (echo "Code formatting changes detected. Run dotnet format and commit changes." && exit 1)

  qodana:
    runs-on: linux-x64
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          api-token: ${{ secrets.security-api-token }}
          customer-id: tracebit
          profile: administrator
          profile-region: us-east-1
          async: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json
      - name: Install dependencies
        run: dotnet restore
      - name: Install dependent tools
        run: dotnet tool restore
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: --baseline qodana.sarif.json --fail-threshold 0
        env:
          QODANA_TOKEN: ${{ secrets.qodana-token }}
