name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@904ee3a84578e3b19bcd0e8c9354051fe148d51e # v1.3.0
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          customer-id: tracebit
          profile: administrator
          profile-region: us-east-1
          async: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Tracebit.Cli.Tests/Tracebit.Cli.Tests.csproj --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage

      - name: Run integration tests
        run: dotnet test Tracebit.Cli.Integration.Tests/Tracebit.Cli.Integration.Tests.csproj --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage

      - name: Run E2E tests
        # Only in the internal repository: the public mirror has no staging secret
        if: github.repository == 'tracebit-com/tracebit-cli-internal'
        env:
          # Staging deploy tests skip when this is empty, e.g. on pull requests from forks
          TRACEBIT_STAGING_API_TOKEN: ${{ secrets.TRACEBIT_STAGING_API_TOKEN }}
        run: dotnet test Tracebit.Cli.E2E.Tests/Tracebit.Cli.E2E.Tests.csproj --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: ./coverage/**/*

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@904ee3a84578e3b19bcd0e8c9354051fe148d51e # v1.3.0
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          customer-id: tracebit
          profile: administrator
          profile-region: us-east-1
          async: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1@v8
        with:
          name: test-results-ubuntu-latest
          path: ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        run: reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"merged-coverage" -reporttypes:"Cobertura"

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: merged-coverage/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '40 60'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
